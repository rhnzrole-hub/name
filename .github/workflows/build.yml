name: Build unofficial Telegram APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in API_ID API_HASH KEYSTORE KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch source and apply changes
        run: |
          git clone --no-checkout https://github.com/DrKLO/Telegram.git source
          git -C source checkout 3de37c8cfb039452be7398909461da6288babf15
          git -C source submodule update --init --recursive --depth 1
          git -C source apply "$GITHUB_WORKSPACE/changes.patch"
      - name: Configure credentials
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > source/TMessagesProj/config/release.keystore
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('source/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java')
          s = p.read_text()
          api_id, api_hash = os.environ['API_ID'], os.environ['API_HASH']
          if not api_id.isdigit() or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Invalid API ID or API hash')
          s = re.sub(r'public static int APP_ID = \d+;', 'public static int APP_ID = ' + api_id + ';', s)
          s = re.sub(r'public static String APP_HASH = "[^"]*";', 'public static String APP_HASH = "' + api_hash + '";', s)
          s = s.replace('public static boolean SUPPORTS_PASSKEYS = true;', 'public static boolean SUPPORTS_PASSKEYS = false;')
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: source
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace "-PRELEASE_KEY_ALIAS=$KEY_ALIAS" "-PRELEASE_KEY_PASSWORD=$KEY_PASSWORD" "-PRELEASE_STORE_PASSWORD=$STORE_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-custom-apk
          path: source/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
